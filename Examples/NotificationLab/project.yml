# XcodeGen spec for NotificationLab.xcodeproj. The project file is committed, so XcodeGen is
# only needed after changing this file: run `xcodegen` in this folder.
name: NotificationLab
options:
  bundleIdPrefix: io.github.muhittincamdali
  deploymentTarget:
    iOS: "17.0"
packages:
  NotificationKit:
    path: ../..
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  NotificationLab:
    type: application
    platform: iOS
    sources: [NotificationLab]
    dependencies:
      - package: NotificationKit
        product: NotificationKit
      - target: NotificationLabService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.muhittincamdali.NotificationLab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Notification Lab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: NotificationLab/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: io.github.muhittincamdali.NotificationLab
            CFBundleURLSchemes: [notificationlab]
  NotificationLabService:
    type: app-extension
    platform: iOS
    sources: [NotificationLabService]
    dependencies:
      - package: NotificationKit
        product: NotificationKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.muhittincamdali.NotificationLab.Service
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Notification Lab Service
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: NotificationLabService/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  NotificationLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NotificationLabUITests]
    dependencies:
      - target: NotificationLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.muhittincamdali.NotificationLab.UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NotificationLab
schemes:
  NotificationLab:
    build:
      targets:
        NotificationLab: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NotificationLabUITests

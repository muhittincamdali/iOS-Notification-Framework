# Link check settings shared by every repository (links.yml writes this file when a repository
# has none). Keep the exclusions short and explain each one: a link that is excluded is a link
# nobody checks.

# Re-check a link at most once a day; the cache is kept between workflow runs.
cache = true
max_cache_age = "1d"
cache_exclude_status = "429, 500.."

max_concurrency = 8
max_retries = 3
timeout = 20

# Anchors (#section) in Markdown and HTML files must exist, so README buttons and the table of
# contents cannot point at a renamed heading.
include_fragments = "anchor-only"

# 403/429 from rate limiting are not broken links; everything else outside 2xx is.
accept = ["200..=299", "403", "429"]

exclude_loopback = true
exclude_private = true
exclude_link_local = true

exclude = [
  # Sites that answer automated requests with 999 or a sign-in wall.
  '^https://(www\.)?linkedin\.com/',
  '^https://(www\.)?x\.com/',
  # Placeholder hosts used in code samples.
  '^https?://(www\.)?example\.(com|org|net)',
  '^https?://api\.example\.com',
  # Pull request and comparison pages that only exist after a push.
  '^https://github\.com/[^/]+/[^/]+/compare/',
]

exclude_path = [
  "node_modules",
  ".build",
  "build",
  "Pods",
]

# Links that only resolve once this pull request is merged and the documentation is deployed:
# the badge and button images on raw.githubusercontent.com and github.com point at main, and the
# DocC site on github.io is published from main. Until then they are checked at the commit that
# adds them. Delete this block after the first documentation deploy so the real addresses are
# checked again.
remap = [
  '^https://muhittincamdali\.github\.io/iOS-Notification-Framework/documentation/.* https://github.com/muhittincamdali/iOS-Notification-Framework/tree/93efabc10cff020aa821591112895773acbad1ae/Sources/NotificationKit/NotificationKit.docc',
  '^https://raw\.githubusercontent\.com/muhittincamdali/iOS-Notification-Framework/main/(.*) https://raw.githubusercontent.com/muhittincamdali/iOS-Notification-Framework/93efabc10cff020aa821591112895773acbad1ae/$1',
  '^https://github\.com/muhittincamdali/iOS-Notification-Framework/blob/main/(.*) https://github.com/muhittincamdali/iOS-Notification-Framework/blob/93efabc10cff020aa821591112895773acbad1ae/$1',
]

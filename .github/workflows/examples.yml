# Repository-specific: builds the example app the README samples are copied from, runs its UI
# tests on a simulator, and builds the push sender.
name: Examples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  notification-lab:
    name: NotificationLab (iOS simulator)
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: xcodebuild -version

      - name: Build and run the UI tests
        working-directory: Examples/NotificationLab
        run: |
          set -o pipefail
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "::error::No available iPhone simulator on this image"
            exit 1
          fi
          xcodebuild test -project NotificationLab.xcodeproj -scheme NotificationLab \
            -destination "id=$udid" -skipPackagePluginValidation -skipMacroValidation -quiet \
            -resultBundlePath "$RUNNER_TEMP/NotificationLab.xcresult"

      - name: Summarise a failed run
        if: failure()
        run: |
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/NotificationLab.xcresult" || true
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/NotificationLab.xcresult" || true

      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NotificationLab-xcresult
          path: ${{ runner.temp }}/NotificationLab.xcresult
          retention-days: 7

  push-sender:
    name: PushSender (macOS)
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and write a payload
        working-directory: Examples/PushSender
        run: |
          swift build
          swift run nk-push payload --title "Order shipped" --body "A-1042 is on its way." \
            --deeplink myapp://orders/A-1042

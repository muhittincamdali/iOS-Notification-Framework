# Managed by the repository kit (muhittincamdali/.github). Pages source must be "GitHub Actions".
name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  docc:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: muhittincamdali/.github/.github/workflows/docc-pages.yml@59e72703c617cfab0c12482c477e706c485ed683 # v1.1.1
    with:
      targets: NotificationKit NotificationKitAPNs
      # The package scheme builds both modules, so both archives exist to be merged.
      scheme: NotificationKit-Package
      deploy: ${{ github.event_name != 'pull_request' }}
